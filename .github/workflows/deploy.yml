name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/Listmonk-Dashboard
            git fetch origin main
            git clean -fd
            git reset --hard origin/main
            docker compose up -d --build
            sleep 5
            curl -f http://localhost:8000/auth/login || (echo "Instance 1 deploy failed!" && exit 1)

            cd /root/Listmonk-Dashboard-2
            git fetch origin main
            git clean -fd
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.instance2.yml up -d --build
            sleep 5
            curl -f http://localhost:8001/auth/login || (echo "Instance 2 deploy failed!" && exit 1)
