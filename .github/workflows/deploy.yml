name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  # Deploys used to go straight to both production instances on every push,
  # untested. The deploy job now only runs once the full suite passes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        env:
          SESSION_SECRET: ci-only-not-a-secret
          DATA_DIR: ${{ runner.temp }}/dashboard-data
        run: pytest tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/Listmonk-Dashboard
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            for i in $(seq 1 15); do
              if curl -fs http://localhost:8000/auth/login > /dev/null; then
                echo "Instance 1 is healthy!"
                break
              fi
              echo "Waiting for Instance 1 to respond ($i/15)..."
              sleep 2
            done
            curl -fs http://localhost:8000/auth/login > /dev/null || (echo "Instance 1 deploy failed!" && exit 1)

            cd /root/Listmonk-Dashboard-2
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.instance2.yml up -d --build
            for i in $(seq 1 15); do
              if curl -fs http://localhost:8001/auth/login > /dev/null; then
                echo "Instance 2 is healthy!"
                break
              fi
              echo "Waiting for Instance 2 to respond ($i/15)..."
              sleep 2
            done
            curl -fs http://localhost:8001/auth/login > /dev/null || (echo "Instance 2 deploy failed!" && exit 1)

